# Version catalog for RC Launcher (Task 1 — multi-module scaffolding).
#
# Every dependency / plugin version lives here as a SINGLE SOURCE OF TRUTH so
# the three Gradle modules (:app, :core, :runtime) stay coherent and there is
# no per-module version drift. Changing a number in this file ripples through
# the whole project.
#
# Compose coherence note (why `compose` and `material3` are pinned together):
#   Material 3's TypographyTokens calls `TextStyle.copy$default`, a Kotlin
#   synthetic method whose SIGNATURE depends on the exact Compose UI version it
#   was compiled against. Shipping a Material 3 built against Compose UI 1.6.x
#   together with Compose UI 1.5.x on the runtime classpath produced a runtime
#   `java.lang.NoSuchMethodError` (see logcat/25_08-13-50-16_522.log). To make
#   that class of bug impossible we (a) align every Compose artifact through the
#   official Compose BOM and (b) hard-pin the whole Compose stack via
#   resolutionStrategy.force in app/build.gradle.kts — both sourced from the
#   `compose` / `material3` versions below.

[versions]
agp = "9.1.0"
# Kotlin 2.4.x — the Compose compiler is now bundled into the Kotlin Gradle plugin
# via `org.jetbrains.kotlin.plugin.compose` (no separate `composeCompiler` version).
kotlin = "2.4.10"
# Single, mutually-compatible Compose set, sourced from the official Compose BOM
# (2026.08.00) so `compose` / `material3` / `materialIconsExtended` can never drift:
#   androidx.compose.ui:*                            = 1.12.0
#   androidx.compose.material3                       = 1.4.0
#   androidx.compose.material:material-icons-extended = 1.7.8
composeBom = "2026.08.00"
compose = "1.12.0"
material3 = "1.4.0"
materialIconsExtended = "1.7.8"

coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
navigationCompose = "2.9.8"
# kotlinx-serialization backs Navigation Compose 2.9.x type-safe routes
# (every @Serializable route class needs a generated serializer at compile time).
kotlinxSerialization = "1.8.1"

junit = "4.13.2"
robolectric = "4.12.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
androidxTestRunner = "1.6.1"
androidxTestRules = "1.6.1"

detekt = "1.23.6"
ktlint = "12.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Provides the @Serializable annotation + runtime used by type-safe nav routes.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose BOM: aligns ui / material3 / foundation / runtime / animation / ...
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Compose artifacts are versioned by the BOM (no explicit version here) and
# additionally hard-pinned by app/build.gradle.kts -> resolutionStrategy.force.
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Generates the serializers required by @Serializable navigation routes.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

name: StyleCheck

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  rust:
    name: Rust (fmt + clippy)
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cd rust && cargo fmt --all -- --check

      - name: cargo clippy
        run: cd rust && cargo clippy --all-targets --all-features -- -D warnings

  kotlin:
    name: Kotlin (ktlint + detekt)
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlintCheck
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

name: Health Audit

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Mirror / manifest / license audit
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run health audit
        run: python3 scripts/health_audit.py --out build/reports

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: build/reports

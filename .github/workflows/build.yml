name: Build

on:
  workflow_call:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Cross-compile the Rust core to a native .so for arm64-v8a.
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build libcrc_launcher.so
        working-directory: rust
        run: cargo ndk -t aarch64-linux-android -o ../core/src/main/jniLibs build --release
      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-arm64-v8a
          path: core/src/main/jniLibs/arm64-v8a

  # 2) Run Rust unit tests on the host.
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace

  # 3) Build the signed APK with Gradle.
  android:
    name: Android APK
    needs: rust-core
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Rust .so artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-core-arm64-v8a
          path: core/src/main/jniLibs/arm64-v8a
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 36 + build-tools 36
        run: echo "y" | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
      - name: Decode release keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          ls -l release-keystore.jks
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

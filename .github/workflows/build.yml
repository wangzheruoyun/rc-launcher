# com.rc.launcher — CI build (all builds run on GitHub Actions).
#
# Pipeline:
#   1. rust-core  — for each Android ABI, cross-compile the Rust core to
#                   libcrc_launcher.so via cargo-ndk (needs the Android NDK).
#   2. rust-test  — run the Rust unit tests on the host (no NDK required).
#   3. android    — assemble + download the .so artifacts, then build the
#                   signed APK and AAB with Gradle.
#
# Caches for Cargo and Gradle are used to keep the workflow fast.

name: Build

on:
  workflow_call:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Required repository secrets for signed release builds (consumed by
# app/build.gradle.kts via the KEYSTORE_BASE64 gate):
#   KEYSTORE_BASE64    - base64-encoded release .jks keystore
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - signing key alias
#   KEY_PASSWORD       - signing key password
# When these are absent (fork PRs, local dry-runs) the release build falls
# back to the auto-generated debug key so an installable APK/AAB is always
# produced. This mirrors the FCL build.yml / Zalith push_ci signing flow.

jobs:
  # ---------------------------------------------------------------------------
  # 1) Cross-compile the Rust core to a native .so for every target ABI.
  # ---------------------------------------------------------------------------
  rust-core:
    name: Rust core (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          # Cache the registry, git index, build artifacts AND the cargo-ndk
          # binary (installed via `cargo install`) so subsequent runs skip the
          # NDK cross-compile dependency resolution and the cargo-ndk install.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build libcrc_launcher.so
        working-directory: rust
        run: cargo ndk -t ${{ matrix.target }} -o ../core/src/main/jniLibs build --release

      # cargo-ndk emits the .so under an Android-ABI-named subfolder (e.g.
      # arm64-v8a) of the -o directory, not under the Rust target triple,
      # so upload directly from the ABI folder Gradle expects.
      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-${{ matrix.abi }}
          path: core/src/main/jniLibs/${{ matrix.abi }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) Run the Rust unit tests on the host (validates the subsystem units).
  # ---------------------------------------------------------------------------
  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace

      # Task 7 — drive the launch engine end-to-end against a fake JRE: assembles
      # the command line, spawns + supervises the process, classifies a crash and
      # escalates SIGTERM -> SIGKILL on a hung game. Fails the build on regression.
      - name: Launch-engine end-to-end demo
        working-directory: rust
        run: cargo run --example launch_demo

      # Task 20 - drive the i18n framework end-to-end: locale negotiation
      # (Chinese-first), runtime language switching, placeholder/plural
      # rendering, localised crash + error copy, the fallback chain and the
      # runtime translation overlay. Asserts its own invariants, so a broken
      # catalogue fails the build.
      - name: i18n end-to-end demo
        working-directory: rust
        run: cargo run --example i18n_demo

      # Task 20 - the locale-aware value formatters (byte sizes, rates, ETAs,
      # percentages, relative time) exist twice: `i18n::number` in the Rust core
      # and `RcValueFormat.kt` in Compose, because the UI formats locally from
      # the catalogue bundle instead of paying a JNI crossing per label. Render
      # the golden matrix with the Rust oracle and fail if the committed fixture
      # the Kotlin parity test replays is stale.
      - name: i18n formatter golden fixture is fresh
        working-directory: rust
        run: |
          cargo run --quiet --example i18n_format_golden > /tmp/golden.tsv
          if ! diff -u ../app/src/test/resources/i18n_format_golden.tsv /tmp/golden.tsv; then
            echo "::error::i18n_format_golden.tsv is stale - run:"
            echo "::error::  cd rust && cargo run --example i18n_format_golden -- --write"
            exit 1
          fi

      # Task 18 - drive the AWT/Swing compatibility layer ("fakefx") end-to-end
      # over *real* named pipes with a fake JVM and a fake UI: a full repaint, a
      # corrupt frame, a damage-only patch, the whole control plane (cursor /
      # title / IME / clipboard both ways) and a touch + key round trip. It
      # asserts its own invariants, so a regression in the bridge fails the build.
      - name: AWT bridge end-to-end demo
        working-directory: rust
        run: cargo run --example awt_demo
      # Task 6 — verify the prebuilt FCL JRE packages (extracted from the FCL
      # APK into runtime/src/main/assets/app_runtime/java/) still match the
      # committed jre_manifest.json. The cargo tests above already install,
      # verify and extract those packages end-to-end; this guards the manifest
      # metadata (SHA-1 / size / build number) against drift.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prebuilt JRE manifest
        run: python3 runtime/generate_jre_manifest.py --check
      # Task 20 - the `.properties` catalogues are the single source of truth for
      # every user-facing string; this proves the generated Android resources
      # (values/, values-en/, values-zh-rTW/, locales_config.xml and the
      # key -> R.string map) are in sync, that no locale has a missing / orphan
      # key, that no placeholder drifted, and that every key referenced by the
      # Rust core (crash categories, RcError) and the Compose UI (RcStringKeys)
      # actually exists. It also cross-checks the two value-formatter ports
      # (`i18n/number.rs` vs `RcValueFormat.kt`): identical byte-unit and
      # duration ladders, the same catalogue keys, the same precision cap, and a
      # fresh golden fixture.
      - name: Verify i18n catalogues and generated resources
        run: python3 scripts/check_i18n.py

      # Task 18 - the AWT bridge wire format is implemented twice (Rust core +
      # Compose layer). A constant that drifts between them compiles and unit-tests
      # fine on both sides, and only shows up on a device as a permanently black
      # canvas or a clipboard answer the JVM cannot parse. This static check needs
      # neither a Rust toolchain nor a JVM, so it also covers the Kotlin half that
      # CI cannot unit-test on every runner.
      - name: Verify the AWT wire contract (Rust <-> Kotlin)
        run: python3 scripts/check_awt_wire.py

      - name: Prebuilt JRE assets present
        run: |
          for v in jre8 jre17 jre21; do
            for f in universal.tar.xz bin-arm64.tar.xz version; do
              test -f "runtime/src/main/assets/app_runtime/java/$v/$f" || \
                { echo "missing prebuilt JRE asset: $v/$f"; exit 1; }
            done
          done
          echo "prebuilt JRE assets OK"

  # ---------------------------------------------------------------------------
  # 3) Build the Android app (APK + AAB) with Gradle.
  # ---------------------------------------------------------------------------
  android:
    name: Android APK / AAB
    needs: rust-core
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust .so artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rust-core-*
          path: rust-artifacts

      # upload-artifact preserves the full workspace-relative path, so we copy
      # each .so into the canonical jniLibs/<triple>/ location for :core.
      # The rust-core-* artifact (rust-core-arm64-v8a) is downloaded
      # into rust-artifacts/<name>/. Map by ABI so the .so lands in the canonical
      # jniLibs/<abi>/ location Gradle expects, independent of upload-artifact's
      # inner-path handling.
      - name: Assemble native libraries
        run: |
          mkdir -p core/src/main/jniLibs
          for abi in arm64-v8a; do
            src="rust-artifacts/rust-core-$abi/librc_launcher.so"
            if [ -f "$src" ]; then
              mkdir -p "core/src/main/jniLibs/$abi"
              cp -f "$src" "core/src/main/jniLibs/$abi/"
              echo "placed $abi <- $src"
            else
              echo "WARNING: missing native lib for $abi ($src)"
            fi
          done
          echo "Assembled native libraries:"
          find core/src/main/jniLibs -name '*.so' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmdline-tools;latest" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Ensure Gradle wrapper is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      # Decode the release keystore from the KEYSTORE_BASE64 secret (when
      # present) into $rootDir/release-keystore.jks. This mirrors the FCL
      # build.yml / Zalith push_ci flow where the signing key is stored
      # base64-encoded in repository secrets and materialised on the runner.
      # Skipped when the secret is absent so fork PRs / dry-runs still sign
      # with the debug key (see app/build.gradle.kts).
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          ls -l release-keystore.jks

      - name: Build release (APK + AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      # Prove the produced APK is actually signed (valid for both the CI
      # release key and the debug-key fallback) so a broken signing config
      # fails the build instead of shipping an unsigned artifact.
      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1)
          test -n "$APK" || { echo "no release APK produced"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"             && echo "APK signature OK: $APK"             || { echo "APK is NOT signed: $APK"; exit 1; }

  # ---------------------------------------------------------------------------
  # 4) Run the Android unit + Compose UI tests on the JVM (Robolectric) and FAIL
  #    the build on any regression. This is the task-21 test gate for the
  #    Kotlin/Compose side (mirrors the Rust `cargo test` gate above).
  # ---------------------------------------------------------------------------
  android-test:
    name: Android unit + Compose UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmdline-tools;latest" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Ensure Gradle wrapper is present
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
      - name: Run unit + Compose UI tests
        run: ./gradlew testDebugUnitTest --continue

  # ---------------------------------------------------------------------------
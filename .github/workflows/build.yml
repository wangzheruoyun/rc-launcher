name: Build

on:
  workflow_call:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"
  JAVA_OPTS: "-XX:+UseParallelGC -Xmx4g -XX:MaxMetaspaceSize=1g"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Cross-compile the Rust core to a native .so for arm64-v8a.
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        run: cargo binstall cargo-ndk --no-confirm --locked
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-
      - name: Build libcrc_launcher.so
        working-directory: rust
        run: cargo ndk -t aarch64-linux-android -o ../core/src/main/jniLibs build --release
      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-arm64-v8a
          path: core/src/main/jniLibs/arm64-v8a

  # 2) Run Rust unit tests on the host.
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace

  # 3) Build the signed APK with Gradle.
  android:
    name: Android APK
    needs: rust-core
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - name: Download Rust .so artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-core-arm64-v8a
          path: core/src/main/jniLibs/arm64-v8a
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android platform 37 + build-tools 37
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -z "$SDM" ]; then
            echo "No cmdline-tools found, installing from scratch"
            exit 1
          fi
          echo "Using sdkmanager from: $SDM"
          yes | "$SDM/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$SDM/sdkmanager" --install "cmdline-tools;latest" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches
            wrapper
            notifications
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
      - name: Decode release keystore (if provided)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          ls -l release-keystore.jks
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache --parallel
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

# --- Task 23: skin import tutorial ---
skin.tutorial.title = Skin Import Tutorial
skin.tutorial.step_indicator = Step {current} of {total}
skin.tutorial.step.get.title = Get a skin
skin.tutorial.step.get.body = You can get skins through official channels: log in to your Minecraft account on the official website and download the skin from your profile page. Third-party skin sites (e.g. TheSkindex, MinecraftSkins.com) also offer a wide variety of skins.
skin.tutorial.step.format.title = File format
skin.tutorial.step.format.body = The skin must be in PNG format. Recommended size is 64x64 (Steve/Classic) or 64x32 (Alex/Slim). Supported sizes include: 64x64, 64x32, 128x128, 128x64, 128x192, 256x256, 256x128.
skin.tutorial.step.import.title = Import the skin
skin.tutorial.step.import.body = Open the skin preview dialog on the Accounts screen, tap "Pick local image", select a PNG image from your gallery or files. The launcher will automatically validate the dimensions.
skin.tutorial.step.apply.title = Apply to account
skin.tutorial.step.apply.body = Choose the correct skin model (Steve/Classic or Alex/Slim), then tap "Upload local skin" to upload it to Mojang. The upload progress is shown in real time.
skin.tutorial.step.done.title = Tutorial complete
skin.tutorial.step.done.body = The skin import tutorial is complete. You can revisit it at any time.

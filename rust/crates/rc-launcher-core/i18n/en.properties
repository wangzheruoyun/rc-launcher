# --- Crash recovery suggestions (task 24) ---
crash.recovery.re_download_natives = Re-download the LWJGL / renderer native libraries from a mirror, then retry. If mirrors do not work, configure an HTTP/SOCKS5 proxy under Settings -> Network.
crash.recovery.re_download_version = Re-download the version files from a mirror (the download was likely interrupted), then retry. If mirrors do not work, configure a proxy under Settings -> Network.
crash.recovery.switch_renderer = Switch the OpenGL ES translation renderer (Settings -> Renderer), then retry. If the problem persists, re-download the runtime natives via a mirror.


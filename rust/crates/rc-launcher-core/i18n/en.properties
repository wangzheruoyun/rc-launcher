# --- Crash diagnosis (keys derive from CrashCategory::id in launch/crash.rs) ---
crash.clean_exit.summary = the game exited normally
crash.clean_exit.advice = Nothing to do.
crash.user_terminated.summary = the game was stopped by the launcher
crash.user_terminated.advice = Launch the game again when you are ready.
crash.killed_by_system.summary = Android killed the game process
crash.killed_by_system.advice = Lower the memory allocation, close background apps and keep the launcher in the foreground; Android reclaims memory from background processes.
crash.out_of_memory.summary = the game ran out of memory
crash.out_of_memory.advice = Raise -Xmx if the device has spare RAM, otherwise lower the render distance, remove heavy mods / shaders and reduce the resolution scale.
crash.unsupported_java_version.summary = the selected Java version is incompatible
crash.unsupported_java_version.advice = Switch the instance to the Java version the game requires (Java 8 for <= 1.16, Java 17 for 1.17-1.20.4, Java 21 for 1.20.5+).
crash.missing_native_library.summary = a native library could not be loaded
crash.missing_native_library.advice = Reinstall the runtime components (LWJGL / renderer) and make sure the instance's ABI matches the device.
crash.graphics_failure.summary = the renderer / GPU driver failed
crash.graphics_failure.advice = Try another renderer (GL4ES / Zink / ANGLE), disable shaders and lower the resolution; some drivers need OpenGL ES 3.
crash.native_crash.summary = the Java virtual machine crashed
crash.native_crash.advice = Attach the hs_err_pid log when reporting. Try another renderer, disable mods/shaders and lower the memory allocation.
crash.corrupted_file.summary = a game file is corrupt or incomplete
crash.corrupted_file.advice = Re-download the version (and the failing mod / library): the file is truncated, usually after an interrupted download.
crash.missing_main_class.summary = the game's main class is missing
crash.missing_main_class.advice = Repair or reinstall the version: the client jar or a loader library is missing from the classpath.
crash.authentication_failure.summary = the account session was rejected
crash.authentication_failure.advice = Re-login to the account (the token expired), or use an offline account for single-player.
crash.disk_full.summary = the device is out of storage
crash.disk_full.advice = Free up storage and launch again.
crash.permission_denied.summary = the launcher lacks filesystem permission
crash.permission_denied.advice = Grant storage permission, or move the game directory into the app's private storage.
crash.mod_loader_failure.summary = a mod or mod loader failed to start
crash.mod_loader_failure.advice = Read the mod list in the log: a mod is missing a dependency or is built for another game/loader version. Remove or update it.
crash.game_error.summary = the game threw an unhandled exception
crash.game_error.advice = Check the stack trace in the log; removing the most recently added mod / resource pack usually fixes it.
crash.unknown.summary = the game crashed for an unknown reason
crash.unknown.advice = Export the full log and report it; try launching without mods to narrow it down.


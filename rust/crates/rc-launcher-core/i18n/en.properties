# --- task 14: newbie tutorial & onboarding flow ---
tutorial.title = Onboarding
tutorial.welcome.title = Welcome to RC Launcher
tutorial.welcome.body = RC Launcher is built for Minecraft Java Edition and optimised for mainland-China networks. The next few steps will get you started.
tutorial.step.account.title = Add an account
tutorial.step.account.body = Start by adding a Microsoft / Xbox account in "Accounts". If Mojang is unreachable, enable a mirror or a third-party auth service in Settings.
tutorial.step.instance.title = Create an instance
tutorial.step.instance.body = Use the "Instances" tab to install a new version or import a modpack. Forge, NeoForge, Fabric and Quilt are all supported.
tutorial.step.renderer.title = Pick a renderer
tutorial.step.renderer.body = GL4ES is the default for the broadest compatibility. If you see visual glitches, switch to Zink / ANGLE / VirGL under "Settings → Renderer".
tutorial.step.import.title = Import modpacks & skins
tutorial.step.import.body = The "Downloads" tab imports CurseForge / Modrinth packs and local .zip modpacks. Skin import walkthrough is on the "Accounts" screen.
tutorial.step.done.title = You are all set
tutorial.step.done.body = Onboarding complete. You can rewatch this tutorial anytime from "Settings → Help", or reset it to start from the first step again.

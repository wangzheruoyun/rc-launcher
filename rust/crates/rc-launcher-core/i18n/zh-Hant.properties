skin.tutorial.step.get.body = 可透過官方途徑取得皮膚：登入 Minecraft 官網帳戶，在個人資料頁下載皮膚。第三方皮膚站（如 TheSkindex、Minecraft Skins 等）也提供豐富的皮膚資源。
skin.tutorial.step.format.title = 檔案格式
skin.tutorial.step.format.body = 皮膚必須為 PNG 格式，建議尺寸 64x64（Steve 經典）或 64x32（Alex 版）。支援的尺寸包括：64x64、64x32、128x128、128x64、128x192、256x256、256x128。
skin.tutorial.step.import.title = 匯入皮膚
skin.tutorial.step.import.body = 在帳號頁面開啟皮膫預覽對話框，點擊「選擇本地圖片」，從相簿或文件中選擇一張 PNG 圖片，啟動器會自動驗證尺寸。
skin.tutorial.step.apply.title = 應用到帳戶
skin.tutorial.step.apply.body = 選擇正確的皮膎類型（Steve/Classic 或 Alex/Slim），點擊「上傳本地皮膚」即可上傳到 Mojang，對話框會即時顯示上傳進度。
skin.tutorial.step.done.title = 教學完成
skin.tutorial.step.done.body = 皮膚匯入教學已完成。你可以在隨時查看此教學。
skin.tutorial.start = 開始皮膚匯入教學
skin.tutorial.skip = 跳過
skin.tutorial.next = 下一步
skin.tutorial.previous = 上一步
skin.tutorial.finish = 完成
skin.tutorial.pick = 選擇本地圖片
skin.tutorial.official_note = 從 Minecraft 個人資料頁下載官方皮膚
skin.tutorial.thirdparty_note = 第三方皮膗站提供更多選擇，注意版權和安全
skin.tutorial.format_note = PNG 格式，尺寸必須為 64x64、64x32 或更高偶數尺寸
skin.tutorial.link_task14 = 與任務 14 新手教學聯動：首次登入後自動提示
skin.tutorial.rewatch = 重看皮膚教學


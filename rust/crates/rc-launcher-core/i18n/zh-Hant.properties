# --- task 14: 教學與引導流程 ---
tutorial.title = 新手教學
tutorial.welcome.title = 歡迎使用 RC 啟動器
tutorial.welcome.body = RC 啟動器專為 Minecraft Java 版打造，並針對中國大陸網路進行最佳化。請依序完成下列步驟以快速上手。
tutorial.step.account.title = 新增帳號
tutorial.step.account.body = 請先到「帳號」頁新增微軟 / Xbox 帳號；若無法直接連線，可於「設定」啟用鏡像或第三方驗證服務。
tutorial.step.instance.title = 建立實例
tutorial.step.instance.body = 在「實例」頁可一鍵安裝新版本、匯入整合包，支援 Forge、NeoForge、Fabric、Quilt。
tutorial.step.renderer.title = 選擇渲染器
tutorial.step.renderer.body = 預設使用 GL4ES，相容性最佳；若畫面異常請至「設定 → 渲染器」切換為 Zink / ANGLE / VirGL。
tutorial.step.import.title = 匯入整合包 / 皮膚
tutorial.step.import.body = 「下載」頁可直接匯入 CurseForge、Modrinth 與本地整合包；皮膚匯入教學位於「帳號」頁。
tutorial.step.done.title = 準備就緒
tutorial.step.done.body = 引導完成。您隨時可在「設定 → 說明」重新觀看本教學，或重設後從頭開始。
tutorial.skip = 跳過
tutorial.next = 下一步
tutorial.previous = 上一步
tutorial.finish = 完成
tutorial.rewatch = 重看教學
tutorial.step_indicator = 第 {current} / {total} 步
tutorial.replay_button = 再次查看新手教學
tutorial.replay_summary = 完成首次引導後可隨時重看，方便熟悉新功能


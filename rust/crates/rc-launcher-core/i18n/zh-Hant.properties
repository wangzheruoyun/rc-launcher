# --- 當機診斷（key 取自 launch/crash.rs 的 CrashCategory::id） ----------
crash.clean_exit.summary = 遊戲正常結束
crash.clean_exit.advice = 遊戲正常結束，無需處理。
crash.user_terminated.summary = 遊戲已被啟動器停止
crash.user_terminated.advice = 遊戲已被啟動器停止，可隨時重新啟動。
crash.killed_by_system.summary = Android 終止了遊戲行程
crash.killed_by_system.advice = 系統記憶體不足終止了遊戲行程：請降低記憶體配置、關閉背景應用程式，並讓啟動器保持在前景執行。
crash.out_of_memory.summary = 遊戲記憶體耗盡
crash.out_of_memory.advice = 記憶體不足：裝置記憶體充裕時可調高 -Xmx；否則請降低視距、移除大型模組/光影並降低解析度縮放。
crash.unsupported_java_version.summary = 所選 Java 版本不相容
crash.unsupported_java_version.advice = Java 版本不相符：請切換到該版本所需的 Java（1.16 及更早用 Java 8，1.17-1.20.4 用 Java 17，1.20.5+ 用 Java 21）。
crash.missing_native_library.summary = 原生程式庫載入失敗
crash.missing_native_library.advice = 原生程式庫載入失敗：請重新安裝執行階段元件（LWJGL/渲染器），並確認實例 ABI 與裝置一致。
crash.graphics_failure.summary = 渲染器 / 顯示卡驅動程式異常
crash.graphics_failure.advice = 渲染器或顯示卡驅動程式異常：請嘗試更換渲染器（GL4ES/Zink/ANGLE）、關閉光影並降低解析度。
crash.native_crash.summary = Java 虛擬機當機
crash.native_crash.advice = Java 虛擬機當機：回報時請附上 hs_err_pid 日誌；可嘗試更換渲染器、停用模組/光影並降低記憶體配置。
crash.corrupted_file.summary = 遊戲檔案損毀或不完整
crash.corrupted_file.advice = 檔案損毀或不完整：請重新下載該版本（及出錯的模組/相依程式庫），通常是下載中斷所致。
crash.missing_main_class.summary = 遊戲主類別缺失
crash.missing_main_class.advice = 主類別缺失：請修復或重新安裝該版本，用戶端 JAR 或載入器相依項未在類別路徑中。
crash.authentication_failure.summary = 帳號工作階段被拒絕
crash.authentication_failure.advice = 帳號工作階段失效：請重新登入帳號；僅單人遊戲可改用離線帳號。
crash.disk_full.summary = 裝置儲存空間不足
crash.disk_full.advice = 儲存空間不足：請清理空間後重新啟動。
crash.permission_denied.summary = 啟動器缺少檔案系統權限
crash.permission_denied.advice = 沒有檔案存取權限：請授予儲存權限，或將遊戲目錄遷移到應用程式私有目錄。
crash.mod_loader_failure.summary = 模組或模組載入器啟動失敗
crash.mod_loader_failure.advice = 模組或載入器啟動失敗：請查看日誌中的模組清單，缺少相依項或版本不符的模組需要更新或刪除。
crash.game_error.summary = 遊戲拋出未處理例外
crash.game_error.advice = 遊戲拋出未處理例外：請查看日誌堆疊；通常移除最近新增的模組或資源包即可復原。
crash.unknown.summary = 遊戲因未知原因當機
crash.unknown.advice = 當機原因不明：請匯出完整日誌回報；可先在無模組狀態下啟動以縮小範圍。

# --- 數字 / 單位 / 時長格式（見 src/i18n/number.rs） -----------------------
# 這些是**格式骨架**而非一般文案：分隔符號、單位名稱與組裝範本都由目錄提供，
# 因此「1.4 GB」「1.2 MB/秒」「3 分 20 秒」這類衍生文案與其它譯文同源，
# UI 與核心層不會各自硬寫一套英文單位。佔位符必須逐語言保持一致。
format.group_separator = ,
format.decimal_separator = .
format.invalid_number = —
format.size = {value} {unit}
format.rate = {value} {unit}/秒
format.percent = {value}%
format.progress_of = {done} / {total}
format.duration_join = {first} {second}
format.fps = {value} FPS

# 位元組單位（1024 進制，與 Android/FCL 的顯示習慣一致）
unit.byte = B
unit.kib = KB
unit.mib = MB
unit.gib = GB
unit.tib = TB
unit.pib = PB

# 時長片段（複數形式：中文單複數同形）
duration.zero = 0 秒
duration.second.one = {count} 秒
duration.second.other = {count} 秒
duration.minute.one = {count} 分
duration.minute.other = {count} 分
duration.hour.one = {count} 小時
duration.hour.other = {count} 小時
duration.day.one = {count} 天
duration.day.other = {count} 天

# 相對時間（{duration} 由 duration.* 組出）
relative.now = 剛剛
relative.past = {duration}前
relative.future = {duration}後

# 下載剩餘時間
download.eta = 剩餘 {duration}


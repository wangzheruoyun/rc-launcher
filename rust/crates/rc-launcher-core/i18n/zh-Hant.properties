# --- 崩潰修復建議 (任務 24) ---
crash.recovery.re_download_natives = 請透過鏡像源重新下載 LWJGL / 渲染器原生庫，然後重試。如果鏡像源無法存取，請在設定 -> 網路中設定代理。
crash.recovery.re_download_version = 請透過鏡像源重新下載版本檔案（下載可能已中斷），然後重試。如果鏡像源無法存取，請在設定 -> 網路中設定代理。
crash.recovery.switch_renderer = 請在設定 -> 渲染器中切換 OpenGL/ES 翻譯器，然後重試。如果問題仍未解決，請透過鏡像源重新下載執行時原生庫。


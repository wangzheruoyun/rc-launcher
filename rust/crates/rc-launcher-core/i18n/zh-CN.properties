# --- 数字 / 单位 / 时长格式（见 src/i18n/number.rs） -----------------------
# 这些是**格式骨架**而非普通文案：分隔符、单位名与拼装模板都由目录提供，
# 因此「1.4 GB」「1.2 MB/秒」「3 分 20 秒」这类派生文案与其它译文同源，
# UI 与核心层不会各自硬编码一套英文单位。占位符必须逐语言保持一致。
format.group_separator = ,
format.decimal_separator = .
format.invalid_number = —
format.size = {value} {unit}
format.rate = {value} {unit}/秒
format.percent = {value}%
format.progress_of = {done} / {total}
format.duration_join = {first} {second}
format.fps = {value} FPS

# 字节单位（1024 进制，与 Android/FCL 的显示习惯一致）
unit.byte = B
unit.kib = KB
unit.mib = MB
unit.gib = GB
unit.tib = TB
unit.pib = PB

# 时长片段（复数形式：中文单复数同形）
duration.zero = 0 秒
duration.second.one = {count} 秒
duration.second.other = {count} 秒
duration.minute.one = {count} 分
duration.minute.other = {count} 分
duration.hour.one = {count} 小时
duration.hour.other = {count} 小时
duration.day.one = {count} 天
duration.day.other = {count} 天

# 相对时间（{duration} 由 duration.* 拼出）
relative.now = 刚刚
relative.past = {duration}前
relative.future = {duration}后

# 下载剩余时间
download.eta = 剩余 {duration}


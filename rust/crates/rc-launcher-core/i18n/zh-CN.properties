# --- 崩溃诊断（key 取自 launch/crash.rs 的 CrashCategory::id） -----------
crash.clean_exit.summary = 游戏正常退出
crash.clean_exit.advice = 游戏正常退出，无需处理。
crash.user_terminated.summary = 游戏已被启动器停止
crash.user_terminated.advice = 游戏已被启动器停止，可随时重新启动。
crash.killed_by_system.summary = Android 杀掉了游戏进程
crash.killed_by_system.advice = 系统内存不足杀掉了游戏进程：请降低内存分配、关闭后台应用，并保持启动器在前台运行。
crash.out_of_memory.summary = 游戏内存耗尽
crash.out_of_memory.advice = 内存不足：设备内存充裕时可提高 -Xmx；否则请降低视距、移除大型模组/光影并降低分辨率缩放。
crash.unsupported_java_version.summary = 所选 Java 版本不兼容
crash.unsupported_java_version.advice = Java 版本不匹配：请切换到该版本所需的 Java（1.16 及更早用 Java 8，1.17-1.20.4 用 Java 17，1.20.5+ 用 Java 21）。
crash.missing_native_library.summary = 原生库加载失败
crash.missing_native_library.advice = 原生库加载失败：请重新安装运行时组件（LWJGL/渲染器），并确认实例 ABI 与设备一致。
crash.graphics_failure.summary = 渲染器 / 显卡驱动异常
crash.graphics_failure.advice = 渲染器或显卡驱动异常：请尝试更换渲染器（GL4ES/Zink/ANGLE）、关闭光影并降低分辨率。
crash.native_crash.summary = Java 虚拟机崩溃
crash.native_crash.advice = Java 虚拟机崩溃：反馈时请附上 hs_err_pid 日志；可尝试更换渲染器、禁用模组/光影并降低内存分配。
crash.corrupted_file.summary = 游戏文件损坏或不完整
crash.corrupted_file.advice = 文件损坏或不完整：请重新下载该版本（及报错的模组/依赖库），通常是下载中断导致。
crash.missing_main_class.summary = 游戏主类缺失
crash.missing_main_class.advice = 主类缺失：请修复或重新安装该版本，客户端 JAR 或加载器依赖未在类路径中。
crash.authentication_failure.summary = 账号会话被拒绝
crash.authentication_failure.advice = 账号会话失效：请重新登录账号；仅单人游戏可改用离线账号。
crash.disk_full.summary = 设备存储空间不足
crash.disk_full.advice = 存储空间不足：请清理空间后重新启动。
crash.permission_denied.summary = 启动器缺少文件系统权限
crash.permission_denied.advice = 没有文件访问权限：请授予存储权限，或将游戏目录迁移到应用私有目录。
crash.mod_loader_failure.summary = 模组或模组加载器启动失败
crash.mod_loader_failure.advice = 模组或加载器启动失败：请查看日志中的模组列表，缺少依赖或版本不匹配的模组需要更新或删除。
crash.game_error.summary = 游戏抛出未处理异常
crash.game_error.advice = 游戏抛出未处理异常：请查看日志堆栈；通常移除最近新增的模组或资源包即可恢复。
crash.unknown.summary = 游戏因未知原因崩溃
crash.unknown.advice = 崩溃原因不明：请导出完整日志反馈；可先在无模组状态下启动以缩小范围。

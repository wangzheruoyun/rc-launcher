skin.tutorial.step.format.body = 皮肤必须为 PNG 格式，推荐尺寸 64x64（Steve 经典）或 64x32（Alex 版）。支持的尺寸包括：64x64、64x32、128x128、128x64、128x192、256x256、256x128。
skin.tutorial.step.import.title = 导入皮肤
skin.tutorial.step.import.body = 在账户页面打开皮肤预览对话框，点击「选择本地图片」，从相册或文件中选择一张 PNG 图片，启动器会自动校验尺寸。
skin.tutorial.step.apply.title = 应用到账户
skin.tutorial.step.apply.body = 选择正确的皮肤类型（Steve/Classic 或 Alex/Slim），点击「上传本地皮肤」即可上传到 Mojang，对话框会实时显示上传进度。
skin.tutorial.step.done.title = 教程完成
skin.tutorial.step.done.body = 皮肤导入教程已完成。你可以在随时查看此教程。

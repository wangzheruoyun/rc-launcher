# --- task 14: newbie tutorial & onboarding flow ---
tutorial.title = 新手引导
tutorial.welcome.title = 欢迎使用 RC 启动器
tutorial.welcome.body = RC 启动器专为 Minecraft Java 版打造，针对中国大陆网络环境深度优化。接下来的几步会带你快速上手。
tutorial.step.account.title = 添加账号
tutorial.step.account.body = 先去「账户」页添加一个微软 / Xbox 账号。无法直连时可在「设置」里启用镜像源或第三方验证服务。
tutorial.step.instance.title = 创建实例
tutorial.step.instance.body = 「实例」页可一键安装新版或导入整合包，已支持 Forge、NeoForge、Fabric、Quilt。
tutorial.step.renderer.title = 选择渲染器
tutorial.step.renderer.body = 默认使用 GL4ES，兼容性好。如遇画面异常可在「设置 → 渲染器」中切换到 Zink / ANGLE / VirGL。
tutorial.step.import.title = 导入整合包 / 皮肤
tutorial.step.import.body = 「下载」页支持直接导入 CurseForge、Modrinth 与本地整合包；皮肤导入教程可在「账户」页查看。

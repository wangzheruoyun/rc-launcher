# RC Launcher — 简体中文（zh-CN）消息目录 / message catalogue.
#
# 这是**基准语言**（base locale，任务 20「中文优先」）：本文件必须包含所有 key，
# 其它语言缺失的 key 会按回退链回退到这里（见 src/i18n/language.rs）。
#
# 格式（.properties 子集，见 src/i18n/catalog.rs）：
#   * `key = value`，以第一个未转义的 `=` 分隔；value 中可自由使用 `=` 与 `:`。
#   * `#` / `!` 开头为注释；空行忽略；支持 UTF-8 BOM 与 CRLF。
#   * 行尾 `\` 续行；转义：`\n` `\r` `\t` `\\` `\=` `\:` `\uXXXX`。
#   * 占位符为 `{name}`，字面量大括号写作 `{{` / `}}`（见 src/i18n/format.rs）。
#
# 修改后请运行 `cargo test -p rc-launcher-core i18n`（校验 key 齐备性与占位符一致性）。


[workspace]
resolver = "2"
members = ["crates/rc-launcher-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/com.rc.launcher/launcher"

[workspace.dependencies]
jni = "0.21"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
